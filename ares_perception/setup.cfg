# Required by ament_python. Without it setuptools puts the console scripts in
# bin/ and ros2 run looks for them in lib/ares_perception, so every node in
# this package is invisible to launch with a message that sounds like the
# package failed to build when it built fine.
[develop]
script_dir=$base/lib/ares_perception
[install]
install_scripts=$base/lib/ares_perception
