[pytest]
# ares_perception is an ament_python package, so the importable package sits
# one level down. colcon puts it on the path inside the container; this does
# the same for a bare pytest on a laptop.
pythonpath = . ares_perception

testpaths = ares_math/tests ares_description/test ares_perception/test ares_sim/test eval/rellis_ablation/tests
markers =
    slow: derivations and solvers that take more than a moment
filterwarnings =
    error::DeprecationWarning
